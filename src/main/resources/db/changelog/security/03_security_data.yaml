databaseChangeLog:
  - changeSet:
      id: 14-insert-authorities
      author: student
      changes:
        - sql:
            sql: |
              insert into authorities(authority)
              values ('FULL'), ('READ_ONLY');

  - changeSet:
      id: 15-insert-roles
      author: student
      changes:
        - sql:
            sql: |
              insert into roles(role, authority_id)
              values
              ('EMPLOYER', (select id from authorities where authority = 'FULL')),
              ('APPLICANT', (select id from authorities where authority = 'READ_ONLY'));

  - changeSet:

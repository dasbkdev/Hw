databaseChangeLog:
  - changeSet:
      id: 01-create-users-table
      author: student
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: varchar(255)
              - column:
                  name: age
                  type: int
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: varchar(55)
                  constraints:
                    nullable: false
              - column:
                  name: avatar
                  type: varchar(255)
              - column:
                  name: account_type
                  type: varchar(50)
                  constraints:
                    nullable: false

  - changeSet:
      id: 02-create-categories-table
      author: student
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: int
        - addForeignKeyConstraint:
            baseTableName: categories
            baseColumnNames: parent_id
            constraintName: fk_categories_parent
            referencedTableName: categories
            referencedColumnNames: id

  - changeSet:
      id: 03-create-resumes-table
      author: student
      changes:
        - createTable:
            tableName: resumes
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: applicant_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: salary
                  type: decimal(12,2)
              - column:
                  name: is_active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: update_time
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: resumes
            baseColumnNames: applicant_id
            constraintName: fk_resumes_applicant
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: resumes
            baseColumnNames: category_id
            constraintName: fk_resumes_category
            referencedTableName: categories
            referencedColumnNames: id

  - changeSet:
      id: 04-create-contact-types-table
      author: student
      changes:
        - createTable:
            tableName: contact_types
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: varchar(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 05-create-contacts-info-table
      author: student
      changes:
        - createTable:
            tableName: contacts_info
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: resume_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: contact_value
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: contacts_info
            baseColumnNames: type_id
            constraintName: fk_contacts_type
            referencedTableName: contact_types
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: contacts_info
            baseColumnNames: resume_id
            constraintName: fk_contacts_resume
            referencedTableName: resumes
            referencedColumnNames: id

  - changeSet:
      id: 06-create-education-info-table
      author: student
      changes:
        - createTable:
            tableName: education_info
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resume_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: institution
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: program
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: date
              - column:
                  name: end_date
                  type: date
              - column:
                  name: degree
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: education_info
            baseColumnNames: resume_id
            constraintName: fk_education_resume
            referencedTableName: resumes
            referencedColumnNames: id

  - changeSet:
      id: 07-create-work-experience-info-table
      author: student
      changes:
        - createTable:
            tableName: work_experience_info
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resume_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: years
                  type: int
              - column:
                  name: company_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: responsibilities
                  type: varchar(1000)
        - addForeignKeyConstraint:
            baseTableName: work_experience_info
            baseColumnNames: resume_id
            constraintName: fk_work_resume
            referencedTableName: resumes
            referencedColumnNames: id

  - changeSet:
      id: 08-create-vacancies-table
      author: student
      changes:
        - createTable:
            tableName: vacancies
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: category_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: salary
                  type: decimal(12,2)
              - column:
                  name: exp_from
                  type: int
              - column:
                  name: exp_to
                  type: int
              - column:
                  name: is_active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: update_time
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: vacancies
            baseColumnNames: category_id
            constraintName: fk_vacancies_category
            referencedTableName: categories
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: vacancies
            baseColumnNames: author_id
            constraintName: fk_vacancies_author
            referencedTableName: users
            referencedColumnNames: id

  - changeSet:
      id: 09-create-responded-applicants-table
      author: student
      changes:
        - createTable:
            tableName: responded_applicants
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resume_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: vacancy_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: confirmation
                  type: boolean
        - addForeignKeyConstraint:
            baseTableName: responded_applicants
            baseColumnNames: resume_id
            constraintName: fk_response_resume
            referencedTableName: resumes
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: responded_applicants
            baseColumnNames: vacancy_id
            constraintName: fk_response_vacancy
            referencedTableName: vacancies
            referencedColumnNames: id

  - changeSet:
      id: 10-create-messages-table
      author: student
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: responded_applicants
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: varchar(2000)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: responded_applicants
            constraintName: fk_messages_response
            referencedTableName: responded_applicants
            referencedColumnNames: id
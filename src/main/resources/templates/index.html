<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JobSearch</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="nav">
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/vacancies}">Вакансии</a>
        <a th:href="@{/resumes}">Резюме</a>
        <a th:href="@{/vacancies/create}">Создать вакансию</a>
        <a th:href="@{/resumes/create}">Создать резюме</a>
        <a th:href="@{/my-vacancies}">Мои вакансии</a>
        <a th:href="@{/my-resumes}">Мои резюме</a>
        <a th:href="@{/profile}">Профиль</a>
        <a th:href="@{/register}">Регистрация</a>
        <a th:href="@{/login}">Вход</a>
    </div>

    <h1>Главная</h1>

    <div class="actions">
        <a class="btn" th:href="@{/vacancies}">Смотреть вакансии</a>
        <a class="btn" th:href="@{/resumes}">Смотреть резюме</a>
        <a class="btn" th:href="@{/vacancies/create}">Создать вакансию</a>
        <a class="btn" th:href="@{/resumes/create}">Создать резюме</a>
    </div>

    <h2>Актуальные вакансии</h2>

    <div class="cards">
        <div class="card" th:each="vacancy : ${vacancies}">
            <h3>
                <a th:href="@{'/vacancies/' + ${vacancy.id}}" th:text="${vacancy.name}">Vacancy</a>
            </h3>
            <p th:text="${vacancy.description}">Description</p>
            <p>Зарплата: <span th:text="${vacancy.salary}">0</span></p>
            <p>Опыт: <span th:text="${vacancy.expFrom}">0</span> - <span th:text="${vacancy.expTo}">0</span></p>
            <a class="btn" th:href="@{'/vacancies/' + ${vacancy.id}}">Подробнее</a>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создать резюме</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="nav">
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/vacancies}">Вакансии</a>
        <a th:href="@{/resumes}">Резюме</a>
        <a th:href="@{/vacancies/create}">Создать вакансию</a>
        <a th:href="@{/resumes/create}">Создать резюме</a>
        <a th:href="@{/my-vacancies}">Мои вакансии</a>
        <a th:href="@{/my-resumes}">Мои резюме</a>
        <a th:href="@{/profile}">Профиль</a>
        <a th:href="@{/register}">Регистрация</a>
        <a th:href="@{/login}">Вход</a>
    </div>

    <h1>Создать резюме</h1>

    <form method="post" th:action="@{/resumes/create}" th:object="${resumeDto}">
        <input type="text" th:field="*{name}" placeholder="Название">
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

        <select th:field="*{categoryId}">
            <option value="">Выберите категорию</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
        <div th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>

        <input type="number" step="0.01" th:field="*{salary}" placeholder="Зарплата">
        <div th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>

        <select th:field="*{isActive}">
            <option th:value="true">true</option>
            <option th:value="false">false</option>
        </select>

        <button type="submit">Создать</button>
    </form>

    <div class="actions">
        <a class="btn" th:href="@{/resumes}">Назад к резюме</a>
    </div>
</div>
</body>
</html>

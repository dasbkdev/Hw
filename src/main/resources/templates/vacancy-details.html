<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали вакансии</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" th:if="${vacancy != null}">
    <div class="nav">
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/vacancies}">Вакансии</a>
        <a th:href="@{/resumes}">Резюме</a>
        <a th:href="@{/vacancies/create}">Создать вакансию</a>
        <a th:href="@{/resumes/create}">Создать резюме</a>
        <a th:href="@{/my-vacancies}">Мои вакансии</a>
        <a th:href="@{/my-resumes}">Мои резюме</a>
        <a th:href="@{/profile}">Профиль</a>
        <a th:href="@{/register}">Регистрация</a>
        <a th:href="@{/login}">Вход</a>
    </div>

    <h1 th:text="${vacancy.name}">Vacancy</h1>

    <div class="card">
        <p th:text="${vacancy.description}">Description</p>
        <p>Зарплата: <span th:text="${vacancy.salary}">0</span></p>
        <p>Опыт: <span th:text="${vacancy.expFrom}">0</span> - <span th:text="${vacancy.expTo}">0</span></p>
        <p>Дата публикации: <span th:text="${vacancy.createdDate}">date</span></p>
        <p>Дата обновления: <span th:text="${vacancy.updateTime}">date</span></p>
    </div>

    <div class="actions">
        <a class="btn" th:href="@{/vacancies}">Назад к вакансиям</a>
        <a class="btn" th:href="@{/my-vacancies}">Мои вакансии</a>
        <a class="btn" th:href="@{'/responses/' + ${vacancy.id}}">Отклики</a>
    </div>
</div>

<div class="container" th:if="${vacancy == null}">
    <div class="nav">
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/vacancies}">Вакансии</a>
    </div>
    <h1>Вакансия не найдена</h1>
    <a class="btn" th:href="@{/vacancies}">Назад</a>
</div>
</body>
</html>

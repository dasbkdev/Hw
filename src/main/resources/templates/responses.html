<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Отклики</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="nav">
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/vacancies}">Вакансии</a>
        <a th:href="@{/profile}">Профиль</a>
        <a th:href="@{/my-vacancies}">Мои вакансии</a>
        <a th:href="@{/logout}">Выйти</a>
    </div>

    <h1>Отклики</h1>

    <div class="actions">
        <a class="btn" th:href="@{/my-vacancies}">Назад к моим вакансиям</a>
    </div>

    <div class="cards">
        <div class="card" th:each="response : ${responses}">
            <p>ID отклика: <span th:text="${response.id}">0</span></p>
            <p>ID резюме: <span th:text="${response.resumeId}">0</span></p>
            <p>Подтверждено: <span th:text="${response.confirmation}">false</span></p>
            <a class="btn" th:href="@{'/chat/' + ${response.id}}">Открыть чат</a>
        </div>
    </div>
</div>
</body>
</html>

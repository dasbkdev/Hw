<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Чат</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="nav">
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/vacancies}">Вакансии</a>
        <a th:href="@{/profile}">Профиль</a>
        <a th:if="${isEmployer}" th:href="@{/my-vacancies}">Мои вакансии</a>
        <a th:if="${isApplicant}" th:href="@{/my-resumes}">Мои резюме</a>
        <a th:href="@{/logout}">Выйти</a>
    </div>

    <h1>Чат по отклику <span th:text="${responseId}">0</span></h1>

    <div class="actions">
        <a class="btn" href="javascript:history.back()">Назад</a>
    </div>

    <div class="chat-box">
        <div class="message" th:each="message : ${messages}">
            <p th:text="${message.content}">Message</p>
            <small th:text="${message.timestamp}">time</small>
        </div>
    </div>
</div>
</body>
</html>
